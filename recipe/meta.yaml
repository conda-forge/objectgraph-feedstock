{% set name = "objectgraph" %}
{% set version = "1.0.5" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/objectgraph-{{ version }}.tar.gz
  sha256: 93adac7f1caea230072e72c673b154dd5c4d4c65803f8c19a30c917a0d7de764

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - flit
    - python {{ python_min }}
  run:
    - python >={{ python_min }},<4.0
    - typing_extensions

test:
  imports:
    - objectgraph
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://objectgraph.readthedocs.io/
  summary: A basic graph library
  license: MIT
  license_file: doc/license.rst

extra:
  recipe-maintainers:
    - nehaljwani
